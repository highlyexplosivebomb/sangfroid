<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sangfroid | John's Scavenger Hunt</title>
  <meta name="description"
    content="Awoken in a busy Sydney intersection with no memories, a cryptic notebook reveals a conspiracy with dire consequences." />
  <meta property="og:title" content="Sangfroid | John's Scavenger Hunt" />
  <meta property="og:description"
    content="Awoken in a busy Sydney intersection with no memories, a cryptic notebook reveals a conspiracy with dire consequences." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://playsangfroid.com/" />
  <meta property="og:image" content="https://i.imgur.com/opsHzPj.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#b91c1c" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Caveat:wght@600&family=Inter:wght@400;500;600&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <script type="module" src="/src/main.ts"></script>
</head>

<body>
  <div id="mapBackground" class="map-background"></div>
  <div class="static-overlay"></div>
  <main class="page">
    <section class="stage">

      <div id="landingView">
        <div class="landing-screen" id="landingScreen">
          <div class="watch-body" id="watchBody">
            <div class="digital-display" id="digitalDisplay">00:00</div>
          </div>

          <div class="login-actions">
            <button class="landing-action-btn" id="openSignupBtn" type="button">Sign Up</button>
            <button class="landing-action-btn alt" id="openLoginBtn" type="button">Log In</button>
          </div>
        </div>

        <section class="form-panel" id="compassFormPanel">
          <div class="half-compass-bg">
            <svg viewBox="0 0 200 200" class="compass-body">
              <circle cx="100" cy="100" r="96" fill="var(--color-panel)" stroke="var(--color-text)" stroke-width="4" />
              <circle cx="100" cy="100" r="88" fill="none" stroke="var(--color-text)" stroke-width="1.5" />

              <circle cx="100" cy="100" r="85" fill="none" stroke="var(--color-text-muted)" stroke-width="4"
                stroke-dasharray="1 7.901179" stroke-dashoffset="0.5" />
              <circle cx="100" cy="100" r="84" fill="none" stroke="var(--color-text)" stroke-width="6"
                stroke-dasharray="2 41.98229" stroke-dashoffset="1" />

              <polygon points="100,42 115,75 100,100" fill="var(--color-danger)" />
              <polygon points="100,42 85,75 100,100" fill="#991b1b" />

              <polygon points="100,158 85,125 100,100" fill="var(--color-text)" />
              <polygon points="100,158 115,125 100,100" fill="var(--color-text-muted)" />

              <text x="100" y="38" font-family="'Share Tech Mono', monospace" font-size="22" stroke="var(--color-text)"
                stroke-width="1" paint-order="stroke fill" fill="var(--color-text)" text-anchor="middle">N</text>
              <text x="171" y="107" font-family="'Share Tech Mono', monospace" font-size="22" stroke="var(--color-text)"
                stroke-width="1.75" paint-order="stroke fill" fill="var(--color-text)" text-anchor="middle">E</text>

              <circle cx="100" cy="100" r="15" fill="var(--color-primary)" stroke="var(--color-text)"
                stroke-width="3" />
            </svg>
          </div>

          <form id="signupForm" novalidate hidden>
            <section class="signup-stage" data-signup-stage="1">
              <div class="stage-1-content">
                <input type="text" name="gameCode" placeholder="Code" required />
                <p class="stage-description">You can find your code in John's announcement message.</p>
              </div>

              <div class="stage-actions">
                <button class="nav-button ml-auto" type="submit">&gt;</button>
              </div>
            </section>

            <section class="signup-stage" data-signup-stage="2" hidden>
              <div class="choice-grid">
                <button type="button" class="choice-card" id="choiceCreate" data-choice="create-team">
                  <svg class="choice-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z" />
                    <line x1="4" y1="22" x2="4" y2="15" />
                  </svg>
                  <strong>Create Team</strong>
                </button>

                <div class="choice-card join-card">
                  <svg class="choice-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8" />
                    <polyline points="10 17 15 12 10 7" />
                    <line x1="15" y1="12" x2="3" y2="12" />
                  </svg>
                  <strong>Join Team</strong>
                  <div class="join-input-row">
                    <input type="text" name="teamTag" placeholder="Tag" />
                    <button type="button" class="join-go-btn" id="joinTagSubmit">&gt;</button>
                  </div>
                </div>

              </div>
            </section>

            <section class="signup-stage" data-signup-stage="3" data-signup-type="create-team" hidden>
              <div class="grid two-up">
                <label class="col-span-2">
                  <span>Email<span class="req-star">*</span></span>
                  <input type="email" name="email" placeholder="player@example.com" required />
                </label>
              </div>

              <div class="grid two-up">
                <label>
                  <span>Team Name<span class="req-star">*</span></span>
                  <input type="text" name="teamName" placeholder="The Bestest Team" pattern="[A-Za-z\s]+" required />
                </label>
                <label>
                  <span>Your Name<span class="req-star">*</span></span>
                  <input type="text" name="playerName" placeholder="John Doe" required />
                </label>
              </div>

              <div class="stage-actions">
                <button class="nav-button" type="button" data-stage-back="2">&lt;</button>
                <button id="submitButtonCreate" class="nav-button" type="submit">✓</button>
              </div>
            </section>

            <section class="signup-stage" data-signup-stage="4" data-signup-type="join-team" hidden>
              <label>
                <span>Your Name<span class="req-star">*</span></span>
                <input type="text" name="joinPlayerName" placeholder="Jane Doe" required />
              </label>

              <div class="stage-actions mt-lg">
                <button class="nav-button" type="button" data-stage-back="2">&lt;</button>
                <button id="submitButtonJoin" class="nav-button" type="submit">✓</button>
              </div>
            </section>

          </form>

          <form id="loginForm" novalidate hidden>
            <section class="signup-stage">
              <div class="stage-1-content">
                <input type="text" id="loginTagInput" placeholder="Team Tag" autocomplete="off" required />
                <input type="password" id="loginPinInput" placeholder="PIN" autocomplete="off" maxlength="6" required />
              </div>
              <div class="stage-actions">
                <button class="nav-button ml-auto" id="loginTagSubmit" type="submit">&gt;</button>
              </div>
            </section>
          </form>

          <div id="submissionOverlay" class="submission-overlay">
            <div class="animation-container">
              <lottie-player id="savingAnim" class="lottie-anim"
                src="https://lottie.host/831636a3-6cc0-459f-8a24-1758cda83090/IitX4LN06D.json" loop
                autoplay></lottie-player>
              <lottie-player id="successAnim" class="lottie-anim hidden"
                src="https://lottie.host/1a4a12e4-3842-46c5-a979-d795db5c0d5a/KE7bWPQgvy.json"></lottie-player>
            </div>
            <div id="teamTagDisplay" class="team-tag-display hidden">
              <div>
                <strong id="teamTagValue" class="team-tag-value"></strong>
              </div>
              <p id="teamTagHint" class="team-tag-hint">This is your team's Tag. Share it with your teammates so they
                can join!</p>
            </div>
          </div>

        </section>
      </div>

      <div id="gameView" class="hidden"></div>
      <div id="adminView" class="hidden"></div>

    </section>
  </main>
</body>

</html>
